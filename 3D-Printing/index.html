<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">

<title>3D Printing Session - Part 2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:18px;
  font-family:"Tajawal",sans-serif;
  background:
    linear-gradient(rgba(23,105,232,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(23,105,232,.07) 1px,transparent 1px),
    #fff;
  background-size:32px 32px;
}

.wrap{
  width:min(100%,650px);
  overflow:hidden;
  border-radius:22px;
  background:#182438;
  box-shadow:0 20px 55px rgba(24,36,56,.18);
}

.banner{
  width:100%;
  display:block;
}

.content{
  position:relative;
  padding:34px 22px 36px;
  text-align:center;
  color:#c9d3df;
  background:linear-gradient(145deg,#223149,#182438);
}

.icon{
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  margin:0 auto 17px;
  border:1px solid rgba(66,133,240,.4);
  border-radius:16px;
  background:rgba(23,105,232,.12);
  color:#4285f0;
  font-size:28px;
  font-weight:800;
}

h1{
  margin-bottom:10px;
  color:#fff;
  font-size:clamp(25px,7vw,34px);
}

h1 span{color:#4285f0}

p{
  max-width:470px;
  margin:auto;
  font-size:15px;
  line-height:2;
}

.thanks{
  margin-top:21px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.1);
  color:#8796aa;
  font-size:13px;
}

.thanks strong{color:#c8d3df}

@media(max-width:480px){
  body{padding:8px}
  .wrap{border-radius:17px}
  .content{padding:29px 17px 31px}
  p{font-size:14px}
}
</style>
</head>

<body>

<main class="wrap">

  <img
    class="banner"
    src="banner.png"
    alt="3D Printing Session Part 2"
  >

  <section class="content">

    <div class="icon">✓</div>

    <h1>
      اكتمل <span>العدد</span>
    </h1>

    <p>
      نشكركم على الإقبال الرائع على
      <strong>3D Printing Session – Part 2</strong>.
      لقد اكتمل العدد المتاح وأُغلق باب التسجيل.
      نتمنى لكم كل التوفيق، ونلتقي بكم في فعاليات وتجارب قادمة بإذن الله.
    </p>

    <div class="thanks">
      <strong>IEEE An-Najah Student Branch</strong><br>
      See you next time!
    </div>

  </section>

</main>

</body>
</html>
